<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Videoke Phone Requests</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>🎤 SONG REQUEST</h1></header><div class="remote"><h2>Request a karaoke song</h2><p>Search YouTube for a karaoke video, copy its URL, and paste below.</p><button onclick="window.open('https://www.youtube.com/results?search_query=karaoke+lyrics','_blank')">Find Karaoke on YouTube ↗</button><form id="add"><input name="title" placeholder="Song title" required><input name="video" placeholder="YouTube video URL" required><input name="singer" placeholder="Your name (optional)"><button>Add Song</button></form><p id="message"></p><h2>Queue</h2><div id="queue"></div></div><script src="/app.js"></script></body></html>
