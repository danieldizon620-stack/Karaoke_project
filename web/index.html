<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internet Videoke</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>🎤 INTERNET VIDEOKE <small>WINDOWS EDITION</small></h1><div id="remote"></div></header><main><section class="player"><div id="ytplayer"></div><div class="controls"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="next">⏭ Next Song</button><button id="full">⛶ Fullscreen</button><button id="clear">Clear Queue</button></div><h2 id="now">Select a song from the queue</h2></section><aside><h2>Search & Request</h2><button id="search">Search karaoke on YouTube ↗</button><form id="add"><input name="title" placeholder="Song title" required maxlength="160"><input name="video" placeholder="Paste YouTube karaoke URL" required><input name="singer" placeholder="Singer (optional)" maxlength="80"><button>Add to Queue</button></form><p id="message"></p><h2>Upcoming Songs</h2><div id="queue"></div></aside></main><script src="https://www.youtube.com/iframe_api"></script><script src="/app.js"></script></body></html>
