name: Build Windows Videoke EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller pywebview
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name InternetVideoke --add-data "web;web" --collect-all webview app.py
      - uses: actions/upload-artifact@v4
        with:
          name: InternetVideoke_Windows_EXE
          path: dist/InternetVideoke.exe
