name: Build Windows Installer EXE
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pyinstaller pywebview pillow
      - name: Build Windows application
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onedir --windowed --name DannyboisKaraoke --icon assets/dannyboi.ico --add-data "web;web" --collect-all webview app.py
      - name: Verify application executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/DannyboisKaraoke/DannyboisKaraoke.exe')) { throw 'Application EXE was not built.' }
      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")
          $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup 6 is missing on runner. Install it before compiling.' }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Compile installer
        shell: pwsh
        run: '& "${{ steps.inno.outputs.compiler }}" "installer/setup.iss"'
      - name: Verify and list installer output
        shell: pwsh
        run: |
          Get-ChildItem -Path installer -Recurse -Filter '*.exe' | Select-Object FullName,Length | Format-Table
          $setup = Get-ChildItem -Path installer/output -Filter '*Setup.exe' -File -ErrorAction SilentlyContinue
          if (-not $setup) { throw 'Installer was not generated. Review Compile installer log.' }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Dannybois_Karaoke_v4.2_Windows_Installer
          path: installer/output/*Setup.exe
          if-no-files-found: error
